[project]
name = "fedmed"
version = "0.1.0"
description = "Shared library for the FedMed federated medical imaging platform"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["fedmed*"]
